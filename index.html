<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çalışma ve Sınav Portalı</title>
  <meta name="description" content="İnteraktif Çoktan Seçmeli Test, Hafıza Kartları ve Konu Anlatım Platformu.">
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/sidebar.css">
  <link rel="stylesheet" href="./styles/quiz.css">
  <link rel="stylesheet" href="./styles/flashcards.css">
  <link rel="stylesheet" href="./styles/article.css">
</head>
<body>
  <div id="app">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <span class="sidebar-title">KONULAR</span>
      </div>

      <!-- Search Input -->
      <div class="sidebar-search-wrap">
        <div class="sidebar-search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="sidebar-search" class="sidebar-search-input" placeholder="Konularda ara..." autocomplete="off">
        </div>
      </div>

      <!-- Filter Chips -->
      <div class="sidebar-filters">
        <button class="filter-chip active" id="chip-all">Tümü</button>
        <button class="filter-chip" id="chip-mastered">
          <span class="dot-indicator dot-mastered"></span> Öğrenilen
        </button>
        <button class="filter-chip" id="chip-review">
          <span class="dot-indicator dot-review"></span> Tekrar
        </button>
        <button class="filter-chip" id="chip-incomplete">
          <span class="dot-indicator dot-unmarked"></span> Kalan
        </button>
      </div>

      <!-- Full Article Button -->
      <div class="full-article-banner-wrap">
        <div class="full-article-banner" id="btn-full-article">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Tüm Ders Notları (Full Guide)</span>
        </div>
      </div>

      <!-- Sidebar Subheader -->
      <div class="sidebar-subhead">
        <span>Bölümler</span>
        <span>Soru Sayısı</span>
      </div>

      <!-- Topics Tree List -->
      <div class="sidebar-content" id="sidebar-topics-tree">
        <!-- Dynamically rendered via app.js -->
      </div>
    </aside>

    <!-- MAIN APP WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP HEADER -->
      <header class="app-header">
        <div class="header-left">
          <button class="btn-icon" id="btn-toggle-sidebar-header" title="Menüyü Göster / Gizle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="app-brand">
            <div class="app-brand-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
            </div>
            <span id="app-course-title">Çalışma Portalı</span>
          </div>

          <nav class="breadcrumb-nav">
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item active" id="bc-mode-title">Quiz</span>
          </nav>
        </div>

        <!-- Mode Tabs Switcher (Learning Pipeline: 1. Konu Anlatımı -> 2. Flashcards -> 3. Quiz) -->
        <div class="mode-tabs">
          <button class="mode-tab-btn active" data-mode="article">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            Konu Anlatımı
          </button>
          <button class="mode-tab-btn" data-mode="flashcards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
            Flashcards
          </button>
          <button class="mode-tab-btn" data-mode="quiz">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            Quiz
          </button>
        </div>

        <!-- Right Header Actions -->
        <div class="header-actions">
          <button class="btn-icon" id="btn-theme-toggle" title="Karanlık/Aydınlık Tema">
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="btn-ghost" id="btn-reset-progress" title="Tüm İlerlemeyi Sıfırla">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <polyline points="23 20 23 14 17 14"></polyline>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            İlerlemeyi Sıfırla
          </button>
        </div>
      </header>

      <!-- ACTIVE VIEW CONTENT CONTAINER -->
      <main class="view-container" id="view-container">
        <!-- Dynamically rendered based on active mode -->
      </main>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Entry Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
